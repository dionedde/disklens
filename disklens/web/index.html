<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiskLens</title>
<link rel="stylesheet" href="style.css">
<script src="echarts.min.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="14" cy="14" r="10" fill="none" stroke="currentColor" stroke-width="3"/><path d="M14 4a10 10 0 0 1 10 10H14z" fill="var(--accent)"/><path d="M21.5 21.5 29 29" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>
    <span>DiskLens</span>
  </div>
  <div class="pickers">
    <label>Disco <select id="volSel"></select></label>
    <label>Snapshot <select id="snapSel"></select></label>
  </div>
  <div id="scanBox" class="scanbox"></div>
</header>
<div id="adminBar" class="adminbar" hidden></div>
<nav class="tabs" id="tabs">
  <button data-tab="overview" class="on">Visão geral</button>
  <button data-tab="cleanup" class="hl">Liberar espaço</button>
  <button data-tab="explore">Explorar pastas</button>
  <button data-tab="files">Maiores arquivos</button>
  <button data-tab="types">Tipos de arquivo</button>
  <button data-tab="timeline">Linha do tempo</button>
</nav>
<main id="main"></main>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<script src="app.js"></script>
</body>
</html>
